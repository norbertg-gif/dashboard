<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#071018"/><rect width="1280" height="54" fill="#0b1320"/><rect y="54" width="220" height="666" fill="#0b1220"/><rect y="54" x="220" width="1060" height="44" fill="#060a10"/>
  <rect x="16" y="11" width="32" height="32" rx="8" fill="#22d66b"/><text x="58" y="33" fill="#fff" font-family="Segoe UI" font-size="17" font-weight="700">Trading Dashboard</text><text x="700" y="84" fill="#fff" font-family="Segoe UI" font-size="15" font-weight="700">Verdikt</text><line x1="690" y1="96" x2="760" y2="96" stroke="#00d4ff" stroke-width="3"/>
  <rect x="260" y="126" width="940" height="130" rx="12" fill="#101827" stroke="#26364e"/><text x="290" y="166" fill="#fff" font-family="Segoe UI" font-size="26" font-weight="800">Verdikt pre META</text><rect x="1040" y="145" width="112" height="38" rx="19" fill="#3d2d00" stroke="#ffc21a"/><text x="1064" y="170" fill="#ffc21a" font-family="Segoe UI" font-size="15" font-weight="800">POČKAŤ</text><text x="290" y="212" fill="#d7e3f5" font-family="Segoe UI" font-size="17">Ticker je technicky zaujímavý, ale chýba potvrdenie objemom. Pre mierne pokročilého investora dáva zmysel sledovať, nie naháňať cenu.</text>
  <rect x="260" y="286" width="290" height="150" rx="10" fill="#101827" stroke="#26364e"/><text x="286" y="324" fill="#00e276" font-family="Segoe UI" font-size="18" font-weight="800">Prečo áno</text><text x="286" y="362" fill="#b7c8de" font-family="Segoe UI" font-size="15">Trend drží, cena je blízko EMA20 a DIP skóre je silné.</text>
  <rect x="585" y="286" width="290" height="150" rx="10" fill="#101827" stroke="#26364e"/><text x="611" y="324" fill="#ffc21a" font-family="Segoe UI" font-size="18" font-weight="800">Prečo opatrne</text><text x="611" y="362" fill="#b7c8de" font-family="Segoe UI" font-size="15">Volume nepotvrdilo vstup a pattern ešte nemá breakout.</text>
  <rect x="910" y="286" width="290" height="150" rx="10" fill="#101827" stroke="#26364e"/><text x="936" y="324" fill="#4aa3ff" font-family="Segoe UI" font-size="18" font-weight="800">Čo sledovať</text><text x="936" y="362" fill="#b7c8de" font-family="Segoe UI" font-size="15">Daily close nad rezistenciou, earnings termín a reakciu trhu.</text>
  <rect x="260" y="470" width="940" height="140" rx="10" fill="#101827" stroke="#26364e"/><text x="290" y="510" fill="#8ba4c0" font-family="Segoe UI" font-size="13">Vrstva</text><text x="520" y="510" fill="#8ba4c0" font-family="Segoe UI" font-size="13">Stav</text><text x="760" y="510" fill="#8ba4c0" font-family="Segoe UI" font-size="13">Interpretácia</text><text x="290" y="552" fill="#fff" font-family="Segoe UI" font-size="15" font-weight="700">Technika</text><text x="520" y="552" fill="#ffc21a" font-family="Segoe UI" font-size="15" font-weight="700">Watch</text><text x="760" y="552" fill="#d7e3f5" font-family="Segoe UI" font-size="15">Setup existuje, ale nie je čistý.</text><text x="290" y="586" fill="#fff" font-family="Segoe UI" font-size="15" font-weight="700">Fundament</text><text x="520" y="586" fill="#00e276" font-family="Segoe UI" font-size="15" font-weight="700">OK</text><text x="760" y="586" fill="#d7e3f5" font-family="Segoe UI" font-size="15">Analytický cieľ je nad aktuálnou cenou.</text>
</svg>
