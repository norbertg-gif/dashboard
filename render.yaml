services:
  - type: web
    name: trading-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/trading_backend.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: RENDER
        value: "1"
      - key: DATA_DIR
        value: /data
      # Pro tier (4 GB). Bez tejto premennej padá kód na default "low" a beží
      # v úspornom režime aj na zaplatenom stroji.
      - key: DASH_MEMORY_PROFILE
        value: normal
      # ML_N_JOBS=2 využije obe jadrá. Bez tohto by si každý joblib worker
      # otvoril ešte vlastné BLAS vlákna a bili by sa o tie isté dve jadrá.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ETORO_API_KEY_1
        sync: false
      - key: ETORO_USER_KEY_1
        sync: false
      - key: ETORO_API_KEY_2
        sync: false
      - key: ETORO_USER_KEY_2
        sync: false
      - key: DASH_USER
        sync: false
      - key: DASH_PASS
        sync: false
      - key: PUBLIC_API_TOKEN
        sync: false

disks:
  - name: trading-data
    mountPath: /data
    sizeGB: 1
